name: "CanaryCI — Agent Security Gate"
description: "Run deterministic canary & tripwire security tests against AI agents and upload SARIF findings."
author: "CanaryCI Contributors"

branding:
  icon: "shield"
  color: "red"

inputs:
  config:
    description: "Path to canary.yaml configuration file"
    required: false
    default: "canary.yaml"
  tags:
    description: "Comma-separated scenario tags to include (e.g. 'smoke')"
    required: false
    default: ""
  trials:
    description: "Override number of statistical trials per scenario"
    required: false
    default: ""
  sarif-file:
    description: "Output path for SARIF 2.1.0 report"
    required: false
    default: "canary-results.sarif.json"
  upload-sarif:
    description: "Automatically upload SARIF file to GitHub Code Scanning (true/false)"
    required: false
    default: "true"
  baseline-report:
    description: "Optional path to baseline JSON report for regression diffing"
    required: false
    default: ""
  python-version:
    description: "Python version used to run canary-ci"
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: "Exit code returned by canary-ci run (0=pass, 1=breach)"
    value: ${{ steps.run-canary.outputs.exit_code }}
  sarif-path:
    description: "Generated SARIF 2.1.0 report path"
    value: ${{ inputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Execute CanaryCI Suite
      id: run-canary
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_TRIALS: ${{ inputs.trials }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
        INPUT_BASELINE: ${{ inputs.baseline-report }}
      run: |
        ARGS=(run --config "$INPUT_CONFIG" --sarif "$INPUT_SARIF" --markdown-summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$INPUT_TAGS" ]; then
          IFS=',' read -ra TAG_ARR <<< "$INPUT_TAGS"
          for t in "${TAG_ARR[@]}"; do
            ARGS+=(--tag "$t")
          done
        fi
        if [ -n "$INPUT_TRIALS" ]; then
          ARGS+=(--trials "$INPUT_TRIALS")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=(--baseline "$INPUT_BASELINE")
        fi

        set +e
        uvx --from "${GITHUB_ACTION_PATH}/.." canary-ci "${ARGS[@]}"
        CODE=$?
        set -e
        echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to GitHub Security Tab
      if: inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: canary-ci

    - name: Enforce CanaryCI Gate Exit Status
      shell: bash
      run: |
        if [ "${{ steps.run-canary.outputs.exit_code }}" != "0" ]; then
          echo "::error::CanaryCI detected deterministic agent security breaches (exit code ${{ steps.run-canary.outputs.exit_code }})."
          exit "${{ steps.run-canary.outputs.exit_code }}"
        fi
