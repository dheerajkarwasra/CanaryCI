[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "canary-ci"
version = "0.1.0"
description = "Deterministic security and task-completion tests for tool-using AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "CanaryCI Contributors" }
]
keywords = [
    "ai-security",
    "agents",
    "mcp",
    "a2a",
    "canary",
    "ci-cd",
    "owasp-agentic",
    "sarif",
    "prompt-injection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "typer>=0.12.5,<1.0.0",
    "rich>=13.9.0,<15.0.0",
    "httpx>=0.27.2,<1.0.0",
    "mcp>=1.2.0,<2.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "jinja2>=3.1.4,<4.0.0",
]

[project.urls]
Repository = "https://github.com/dheerajkarwasra/CanaryCI"
Documentation = "https://github.com/dheerajkarwasra/CanaryCI#readme"
Issues = "https://github.com/dheerajkarwasra/CanaryCI/issues"

[project.optional-dependencies]
llm = [
    "litellm>=1.52.0,<2.0.0",
]
browser = [
    "playwright>=1.48.0,<2.0.0",
]
dev = [
    "hypothesis>=6.170.17,<7.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-PyYAML>=6.0.12",
]
all = [
    "canary-ci[llm,browser,dev]",
]

[project.scripts]
canary-ci = "canary_ci.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/canary_ci"]

[tool.pytest.ini_options]
minversion = "9.0.3"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "phase1: Phase 1 Core Engine & MVP tests",
    "phase2: Phase 2 Statistical, Memory Persistence & Custom Mock tests",
    "phase3: Phase 3 A2A, Browser DOM Canaries, Diffing & Audit Bundle tests",
    "integration: End-to-end CLI and server integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit security checks
]
ignore = [
    "S101", # allow assert in tests/internal invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["canary_ci"]
mypy_path = "src"
