name: Ticket task check

on:
  pull_request:
    paths:
      - ".github/workflows/ticket-check.yml"
      - "examples/ticket-check/**"
      - "examples/scenarios/support-task.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticket:
    name: Verify the internal note on T1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install CanaryCI 0.1.0
        run: >-
          python -m pip install
          "https://github.com/dheerajkarwasra/CanaryCI/releases/download/v0.1.0/canary_ci-0.1.0-py3-none-any.whl#sha256=c264680991866647d59238decf1767767d55d0b02905084a6228ce9ef9099f65"
      - name: Check the task and security policy
        env:
          PYTHONPATH: examples/ticket-check
        run: |
          trap 'cat "$GITHUB_STEP_SUMMARY"' EXIT
          canary-ci run --config examples/ticket-check/canary.yaml
